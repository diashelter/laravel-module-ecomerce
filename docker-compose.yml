name: ecommerce

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: ecommerce-php:latest
  volumes:
    - ./backend:/var/www/backend
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  api:
    <<: *php
    environment:
      INSTALL_DEPENDENCIES: "true"
    restart: unless-stopped

  queue-worker:
    <<: *php
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=60"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    environment:
      APP_PORT: "${APP_PORT:-8080}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE:-ecommerce}"
      POSTGRES_USER: "${DB_USERNAME:-ecommerce}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images store data under /var/lib/postgresql (not .../data).
      - db_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  frontend_node_modules:
