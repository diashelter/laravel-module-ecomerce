name: ecommerce

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: ecommerce-php:latest
  volumes:
    - ./backend:/var/www/backend
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    mongodb:
      condition: service_healthy

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - api-read
      - frontend
    restart: unless-stopped

  api:
    <<: *php
    environment:
      INSTALL_DEPENDENCIES: "true"
    restart: unless-stopped

  # Serves the storefront (GET /api/products...) from the MongoDB read model. It has no PostgreSQL credentials and
  # does not wait for the db: the environment value wins over backend/.env, and the storefront never opens that
  # connection. The Nginx routes only the storefront reads here.
  api-read:
    <<: *php
    environment:
      DB_HOST: ""
      DB_USERNAME: ""
      DB_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # The Laravel queue (Redis) under Horizon: one supervisor, the parameters of the former queue:work.
  queue-worker:
    <<: *php
    command: ["php", "artisan", "horizon"]
    restart: unless-stopped

  # Publishes the pending outbox messages through the transport of the event-transport flag.
  outbox-relay:
    <<: *php
    command: ["php", "artisan", "outbox:relay"]
    restart: unless-stopped

  # Delivers the RabbitMQ messages to the consumers (the other side of the event-transport flag).
  event-consumer:
    <<: *php
    command: ["php", "artisan", "events:consume"]
    restart: unless-stopped

  # Runs the schedule (routes/console.php): the Horizon snapshot every five minutes.
  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    environment:
      APP_PORT: "${APP_PORT:-8080}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE:-ecommerce}"
      POSTGRES_USER: "${DB_USERNAME:-ecommerce}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images store data under /var/lib/postgresql (not .../data).
      - db_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The read model of the storefront (the catalog_products and catalog_categories collections).
  mongodb:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGODB_USERNAME:-ecommerce}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD:-secret}"
    ports:
      - "${MONGODB_FORWARD_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-ecommerce}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-secret}"
      # The management API refreshes the queue counts every 5 s by default; the tests read them from it.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit collect_statistics_interval 100"
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  rabbitmq_data:
  mongodb_data:
  frontend_node_modules:
