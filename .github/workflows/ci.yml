# Runs the backend checks on every pull request and on every push to main.
# It uses the same Docker Compose services and Makefile targets as local development,
# so CI and `make test` run on the same PHP image and PostgreSQL version.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Pest + Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Create the .env files from the examples
        run: make env-files

      - name: Restore Composer dependencies
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Build the PHP image
        run: docker compose build api

      - name: Start PostgreSQL, Redis, RabbitMQ and the API container
        run: |
          docker compose up -d --wait db redis rabbitmq
          docker compose up -d api
          make wait-api

      - name: Install Composer dependencies
        run: docker compose exec -T api composer install --no-interaction --prefer-dist --no-progress

      - name: Generate the application key
        run: docker compose exec -T api php artisan key:generate --force

      - name: Code style (Pint)
        run: make pint

      - name: Tests (Pest, including the module boundary architecture tests)
        run: make test

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color db api

      - name: Stop the containers
        if: always()
        run: docker compose down --volumes

  # The k6 smoke against the load stack (load-tests/): fails when a route, a status or a payload changes and the
  # scripts did not follow. It checks the responses only, never the latency: a CI runner is not a stable machine.
  load-smoke:
    name: Load smoke (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Create the .env files from the examples
        run: make env-files

      - name: Restore Composer dependencies
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install Composer dependencies and generate the application key
        run: |
          docker compose -f load-tests/docker-compose.yml run --rm --no-deps api composer install --no-interaction --prefer-dist --no-progress
          docker compose -f load-tests/docker-compose.yml run --rm --no-deps api php artisan key:generate --force

      - name: Smoke (k6, real rate limits)
        run: make load-test TYPE=smoke

      - name: Load stack logs
        if: failure()
        run: docker compose -f load-tests/docker-compose.yml logs --no-color api queue-worker outbox-relay event-consumer nginx

      - name: Stop the load stack
        if: always()
        run: make load-down
