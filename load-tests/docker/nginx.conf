# Load test stack: only the API. There is no frontend here, and k6 talks to /api and /sanctum.
server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    location ~ ^/(api|sanctum)(/|$) {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
