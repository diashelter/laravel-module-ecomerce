# The load test stack (HEL-14): a copy of the API with production settings, its own PostgreSQL, Redis and RabbitMQ, and k6.
# It shares only the PHP image and the backend working tree with the development stack.
# Run it through `make load-test TYPE=<profile>` and remove it with `make load-down` (see load-tests/README.md).
name: ecommerce-load

x-php-environment: &php-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://nginx
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  # The working tree is shared with the development API: a cache written in bootstrap/cache would make it
  # read this stack's configuration, database included. The caches stay inside the container.
  APP_CONFIG_CACHE: /tmp/laravel/config.php
  APP_ROUTES_CACHE: /tmp/laravel/routes-v7.php
  APP_EVENTS_CACHE: /tmp/laravel/events.php
  # The module library has no setting for its cache path: the app binds it to this variable (AppServiceProvider).
  APP_MODULES_CACHE: /tmp/laravel/app-modules.php
  # Every value that separates the two stacks is set here: an environment variable wins over backend/.env.
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ecommerce_load
  DB_USERNAME: ecommerce
  DB_PASSWORD: secret
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # Its own MongoDB: the read model of the storefront.
  MONGODB_HOST: mongodb
  MONGODB_PORT: "27017"
  MONGODB_DATABASE: ecommerce_load
  MONGODB_USERNAME: ecommerce
  MONGODB_PASSWORD: secret
  # Its own broker, on the default vhost; the event-transport flag (make load-test TRANSPORT=...) picks whether it is used.
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ecommerce
  RABBITMQ_PASSWORD: secret
  RABBITMQ_VHOST: /
  SESSION_DRIVER: redis
  SESSION_DOMAIN: "null"
  SANCTUM_STATEFUL_DOMAINS: nginx
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  BCRYPT_ROUNDS: "12"
  ORDER_DELIVERY_DELAY_SECONDS: "10"
  # `array` (set by make for the volume profiles) keeps the rate limiter counts in memory, per request:
  # no limit is ever reached. Empty, the limiter uses the default store and the limits are real.
  CACHE_LIMITER: ${CACHE_LIMITER:-}

x-php: &php
  build:
    context: ..
    dockerfile: docker/php/Dockerfile
  image: ecommerce-php:latest
  environment:
    <<: *php-environment
  volumes:
    - ../backend:/var/www/backend
    - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-load.ini:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    mongodb:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ecommerce_load
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: secret
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_load"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The read model of the storefront. No port on the host.
  mongodb:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: ecommerce
      MONGO_INITDB_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 2s
      timeout: 10s
      retries: 30

  # No port on the host: only the stack talks to it.
  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ecommerce
      RABBITMQ_DEFAULT_PASS: secret
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 10s
      retries: 30

  api:
    <<: *php
    environment:
      <<: *php-environment
      # Installs the Composer dependencies only when vendor/ is missing (CI); locally it reuses the shared one.
      INSTALL_DEPENDENCIES: "true"
    volumes:
      - ../backend:/var/www/backend
      - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-load.ini:ro
      - ./docker/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-load.conf:ro

  # Serves the storefront from the read model: no PostgreSQL credentials and no wait for the db (the environment value
  # wins over backend/.env). The same pool as the api, so a run compares like with like.
  api-read:
    <<: *php
    environment:
      <<: *php-environment
      DB_HOST: ""
      DB_USERNAME: ""
      DB_PASSWORD: ""
    volumes:
      - ../backend:/var/www/backend
      - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-load.ini:ro
      - ./docker/fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-load.conf:ro
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  queue-worker:
    <<: *php
    command: ["php", "artisan", "horizon"]

  outbox-relay:
    <<: *php
    command: ["php", "artisan", "outbox:relay"]

  event-consumer:
    <<: *php
    command: ["php", "artisan", "events:consume"]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - api-read

  # Started only by `docker compose run` (the profile keeps `up` from starting it).
  k6:
    image: grafana/k6:2.3.0
    profiles: ["k6"]
    working_dir: /load-tests
    volumes:
      - ./:/load-tests

volumes:
  db_data:
