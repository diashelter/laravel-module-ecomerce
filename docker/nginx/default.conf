# Single entry point: /api and /sanctum go to Laravel (PHP-FPM), everything else to the Vue dev server.
server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    location ~ ^/(api|sanctum)(/|$) {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        # WebSocket upgrade for Vite hot module replacement.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
