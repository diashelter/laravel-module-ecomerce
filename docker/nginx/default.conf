# The request id of the error the gateway itself answers: the one the client sent, or the Nginx's own.
map $http_x_request_id $gateway_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Single entry point: /api, /sanctum and /horizon (the queue dashboard) go to Laravel (PHP-FPM), everything else to the Vue dev server.
server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    # fastcgi_params already carries the client address (REMOTE_ADDR) and the scheme (HTTPS, REQUEST_SCHEME).
    # Laravel trusts no proxy, so X-Forwarded-* headers sent by the client are ignored.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # The storefront (GET and HEAD of the product list and of the product page) is served by api-read, from the
    # MongoDB read model. Any other method of these paths is the api's, like the rest of /api. fastcgi_params already
    # carries the client address (REMOTE_ADDR): a client-sent X-Forwarded-For is ignored, as for the api.
    location ~ ^/api/products(/[^/]+)?$ {
        error_page 418 = @laravel;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 418;
        }

        set $storefront_upstream api-read:9000;
        include fastcgi_params;
        fastcgi_pass $storefront_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_read_timeout 60s;
        fastcgi_intercept_errors on;
        error_page 502 503 504 = @storefront_unavailable;
    }

    location @storefront_unavailable {
        default_type application/json;
        charset utf-8;
        add_header X-Request-ID $gateway_request_id always;
        return 503 '{"code":"SERVICE_UNAVAILABLE","message":"Este recurso está indisponível no momento.","errors":{},"request_id":"$gateway_request_id"}';
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_read_timeout 60s;
    }

    location ~ ^/(api|sanctum|horizon)(/|$) {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        # WebSocket upgrade for Vite hot module replacement.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
